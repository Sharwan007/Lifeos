services:
  lifeos:
    build: .
    image: lifeos-90:latest
    container_name: lifeos
    restart: unless-stopped
    ports:
      - "80:8080"          # change to "8080:8080" if you put nginx/Caddy in front
    environment:
      APP_USER: ${APP_USER:-admin}
      APP_PASSWORD: ${APP_PASSWORD:?Set APP_PASSWORD in a .env file}
    volumes:
      - lifeos-data:/data
volumes:
  lifeos-data:
